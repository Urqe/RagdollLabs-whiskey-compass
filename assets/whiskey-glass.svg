<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" role="img" aria-label="A whiskey glass with a ragdoll cat">
  <defs>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e0a54e"/>
      <stop offset="1" stop-color="#8a4a1b"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="rgba(245,234,216,.18)"/>
      <stop offset=".5" stop-color="rgba(245,234,216,.05)"/>
      <stop offset="1" stop-color="rgba(245,234,216,.16)"/>
    </linearGradient>
  </defs>
  <rect width="320" height="240" fill="none"/>
  <!-- rickhouse planks -->
  <g opacity=".22" stroke="#8a5a2b" stroke-width="3">
    <path d="M0 40h320M0 90h320M0 140h320M0 190h320"/>
  </g>
  <g opacity=".14" stroke="#8a5a2b" stroke-width="2">
    <path d="M40 0v240M120 0v240M200 0v240M280 0v240"/>
  </g>
  <!-- whiskey glass -->
  <g>
    <path d="M118 92h84l-12 96a10 10 0 0 1-10 9h-40a10 10 0 0 1-10-9z" fill="url(#glass)" stroke="#d6c8b2" stroke-width="2"/>
    <path d="M124 118h72l-9 68a8 8 0 0 1-8 7h-38a8 8 0 0 1-8-7z" fill="url(#amber)"/>
    <ellipse cx="160" cy="118" rx="36" ry="6" fill="#e8b465" opacity=".8"/>
  </g>
  <!-- ragdoll cat -->
  <g transform="translate(196,120) scale(.9)">
    <ellipse cx="30" cy="52" rx="34" ry="26" fill="#e8ddcc"/>
    <circle cx="12" cy="20" r="16" fill="#efe6d8"/>
    <path d="M-2 8c4-8 14-10 20-6l10 4-6 8-24 2z" fill="#c9b8a4"/>
    <circle cx="6" cy="18" r="2.4" fill="#5a7fae"/>
    <circle cx="20" cy="18" r="2.4" fill="#5a7fae"/>
    <path d="M4 26c3 3 10 3 14 0" stroke="#8a7a66" stroke-width="1.6" fill="none"/>
    <path d="M52 30c14-6 22 4 20 16" stroke="#e8ddcc" stroke-width="9" fill="none" stroke-linecap="round"/>
  </g>
  <!-- steam -->
  <g stroke="#d6c8b2" stroke-width="2" fill="none" opacity=".35" stroke-linecap="round">
    <path d="M148 84c-4-8 4-12 0-20"/>
    <path d="M164 84c-4-8 4-12 0-20"/>
  </g>
</svg>
